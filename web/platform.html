<style>/*__LEAFLET_CSS__*/</style>
<style>
  /* Design rules: .claude/skills/frontend-design/SKILL.md, "Class changes page".
     The imagery is the page. Chrome sits at the edges, one panel tells one kilometre's story, one strip is the line. */
  :root { --bg:#f3f2ec; --s1:#fbfaf6; --glass:rgba(251,250,246,.92); --s2:#efeee7; --s3:#e6e4db; --line:rgba(28,30,26,.12); --ink:#1c1e1a; --ink-2:#4a4e46; --ink-3:#6f7369;

  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }

  button, input, select { font:inherit; color:inherit; }

  .leaflet-bottom.leaflet-right { right:452px; }
  .glass { background:var(--glass); backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px) saturate(1.2); border:1px solid var(--line); }
  /* top edge */

  .count:empty, .count[data-n="0"] { display:none; }

  #drag { position:absolute; top:0; bottom:0; width:48px; margin-left:-24px; z-index:460; cursor:ew-resize; touch-action:none; }
  #grip { position:absolute; top:46%; left:50%; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%; background:var(--ink); color:var(--bg); display:grid; place-items:center; font:15px var(--mono); box-shadow:0 4px 18px rgba(30,32,26,.2); }
  .side { position:absolute; top:74px; z-index:455; font:11px var(--mono); letter-spacing:.06em; padding:5px 10px; border-radius:99px; white-space:nowrap; pointer-events:none; }
  .yr { position:absolute; top:70px; z-index:470; display:flex; gap:2px; padding:3px; border-radius:99px; } .yr button { background:none; border:0; border-radius:99px; padding:4px 11px; font:500 12px var(--sans); font-variant-numeric:tabular-nums; color:var(--ink-2); cursor:pointer; white-space:nowrap; } .yr button[aria-pressed=true] { background:var(--ink); color:var(--bg); } #ahead button.fut[aria-pressed=true] { background:var(--amber); } .yr .yl { align-self:center; padding:0 6px 0 9px; font:12px var(--sans); color:var(--ink-3); white-space:nowrap; } #aheadNote { position:absolute; top:106px; z-index:470; max-width:300px; padding:6px 10px; border-radius:10px; font-size:12px; color:var(--ink-2); pointer-events:none; }
  .tagwrap { width:0 !important; height:0 !important; overflow:visible; } .tagwrap .plus { position:absolute; top:-11px; } .tagwrap .plus.r { left:0; } .tagwrap .plus.l { right:0; } .tagwrap .plus.c { left:0; transform:translateX(-50%); }
  .plus { font:600 12px/22px var(--sans); font-variant-numeric:tabular-nums; color:#1c1e1a; background:var(--amber); border-radius:99px; padding:0 10px; white-space:nowrap; width:auto !important; transform-origin:left; box-shadow:0 2px 8px rgba(30,32,26,.18); } .plus.maybe { background:#d9c48c; }

  #strip .head .need { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  #strip .head .tools { margin-left:auto; display:flex; gap:6px; }

  #strip .head .kmchip { border-color:var(--ink-2); padding:2px 10px; } #strip .head .kmchip.on { background:var(--ink); color:var(--bg); }
  #strip .head .kmchip b { font-weight:600; margin-right:4px; color:inherit; } #strip .head .kmstep { padding:2px 9px; font-size:14px; line-height:1; }
  .seccap span { position:absolute; left:0; bottom:14px; transform:translateX(-50%); white-space:nowrap; padding:6px 10px 6px 12px; border-radius:8px; border-left:3px solid var(--c); background:rgba(251,250,246,.96); color:var(--ink); border:1px solid var(--line); font-size:12.5px; box-shadow:0 6px 18px rgba(30,32,26,.14); pointer-events:none; }
  .seccap span b { margin-right:6px; }
  .seccap span::after { content:''; position:absolute; left:50%; bottom:-6px; margin-left:-6px; border:6px solid transparent; border-bottom:0; border-top-color:rgba(251,250,246,.96); }
  #strip .head .hi { background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:600; } #strip .head .hi:hover { opacity:.88; }
  #strip .cells { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:3px; }
  #strip .cell { height:30px; border-radius:5px; border:0; padding:0; cursor:pointer; font:600 12px var(--sans); font-variant-numeric:tabular-nums; color:#fff; position:relative; transition:transform .15s; background:var(--c); }
  #strip .cell.st-watch { background:repeating-linear-gradient(135deg, var(--c), var(--c) 4px, #a8975f 4px, #a8975f 8px); }
  #strip .cell.st-nodata, #strip .cell.st-watch, #strip .cell.st-done { color:var(--ink); }
  #strip .cell:hover { transform:translateY(-2px); } #strip .cell.sel { outline:2px solid var(--ink); outline-offset:2px; }
  #strip .cell.open::after { content:''; position:absolute; top:-9px; left:50%; width:8px; height:8px; margin-left:-4px; border-radius:50%; background:var(--bg); border:2px solid var(--ink); }
  #strip .ruler { margin-top:5px; font:11px var(--sans); font-variant-numeric:tabular-nums; color:var(--ink-3); } #strip .ruler span { text-align:center; }
  #strip .key { display:flex; gap:16px; margin-top:7px; font-size:12px; color:var(--ink-2); flex-wrap:wrap; align-items:center; } #strip .key i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  #strip .key i.hatch { background:repeating-linear-gradient(135deg, #d9c48c, #d9c48c 2px, #a8975f 2px, #a8975f 4px); } #strip .key i.ring { border-radius:50%; background:var(--bg); border:2px solid var(--ink); width:9px; height:9px; }
  #strip .key .why { color:var(--ink-3); flex-basis:100%; }
  /* one kilometre's story */
  #inspector { position:absolute; top:70px; right:22px; bottom:20px; width:430px; z-index:600; border-radius:16px; overflow-y:auto; padding:22px 26px 40px; scrollbar-width:thin; }
  .steps { display:flex; gap:18px; margin-bottom:22px; border-bottom:1px solid var(--line); } .steps button { background:none; border:0; padding:0 0 10px; margin-bottom:-1px; color:var(--ink-3); cursor:pointer; font-size:14px; border-bottom:1.5px solid transparent; } .steps button[aria-selected=true] { color:var(--ink); border-color:var(--ink); } .steps .corr { margin-left:auto; }
  .where { font:11px var(--mono); letter-spacing:.08em; color:var(--ink-3); }
  h1 { font:italic 400 64px/1 var(--serif); margin:6px 0 16px; letter-spacing:-.01em; }
  h1.t { font:600 26px/1.2 var(--sans); letter-spacing:-.01em; margin:2px 0 12px; } h1 .sub { display:block; font:400 14px var(--sans); color:var(--ink-3); margin-top:4px; letter-spacing:0; }
  .why { color:var(--ink-2); font-size:14.5px; line-height:1.5; }
  .bignum { display:grid; gap:6px; margin:18px 0; padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .bignum b { font:500 40px/1 var(--sans); font-variant-numeric:tabular-nums; letter-spacing:-.02em; color:var(--amber); white-space:nowrap; } .bignum span { font-size:13px; color:var(--ink-2); line-height:1.45; }
  .photos { display:flex; gap:4px; flex-wrap:wrap; margin:6px 0 8px; } .photos button { background:none; border:1px solid var(--line); border-radius:99px; padding:5px 12px; font-size:13px; cursor:pointer; } .photos button[aria-pressed=true] { background:var(--ink); color:var(--bg); border-color:var(--ink); } .photos .play { margin-left:auto; border-color:var(--ink-2); }
  .proofchart, .spark { display:block; width:100%; height:auto; color:var(--ink); margin:6px 0 4px; } .proofchart text, .spark text { font:11px var(--sans); fill:var(--ink-3); font-variant-numeric:tabular-nums; }
  .facts .wide { display:block; } .facts .wide .k { display:block; margin-bottom:2px; }
  h2 { font:500 15px var(--sans); color:var(--ink); margin:28px 0 8px; }
  p { margin:0 0 12px; } .lead { font-size:19px; line-height:1.42; text-wrap:pretty; } .cap { color:var(--ink-3); font-size:13px; } .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .status { display:inline-flex; align-items:center; gap:8px; font-size:13.5px; margin-bottom:12px; } .status i { width:9px; height:9px; border-radius:50%; background:currentColor; }
  .c-red { color:var(--red); } .c-amber { color:var(--amber); } .c-green { color:var(--green); } .c-grey { color:var(--ink-3); } .c-sand { color:#9a7a2a; }
  .chip.c-sand i, .status.c-sand i { background:#d9c48c; }
  .spark { display:block; margin-top:10px; color:var(--ink); } .spark-k { display:block; font-size:11.5px; }
  .years { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:6px; height:84px; margin:18px 0 6px; align-items:end; }
  .years div { display:flex; flex-direction:column; justify-content:flex-end; height:100%; gap:5px; } .years i { display:block; background:rgba(217,196,140,.45); border-radius:2px 2px 0 0; min-height:1px; } .years i.on { background:var(--amber); }
  .years span { font:500 11px/1 var(--mono); color:var(--ink-3); text-align:center; }
  .trio { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; margin:22px 0 14px; } .trio b { display:block; font:500 34px/1.1 var(--sans); font-variant-numeric:tabular-nums; letter-spacing:-.02em; } .trio span { font-size:12.5px; color:var(--ink-3); line-height:1.35; display:block; margin-top:4px; }
  .bar { position:relative; height:8px; background:rgba(28,30,26,.1); border-radius:4px; margin:6px 0 30px; } .bar span { position:absolute; top:0; bottom:0; } .bar .ex { background:var(--ink); border-radius:4px 0 0 4px; } .bar .co { background:var(--amber); } .bar .po { background:repeating-linear-gradient(45deg, var(--amber), var(--amber) 2px, transparent 2px, transparent 5px); }
  .bar .mk { width:1px; top:-5px; bottom:-5px; background:var(--ink-2); } .bar .mk::after { content:attr(data-l); position:absolute; top:19px; left:-2px; width:110px; font:11px var(--sans); color:var(--ink-3); }
  .note { border-left:2px solid var(--line); padding:1px 0 1px 14px; margin:14px 0; color:var(--ink-2); font-size:14px; } .note.warn { border-color:var(--amber); } .note.bad { border-color:var(--red); color:var(--ink); }
  .facts { margin:8px 0 0; } .facts div { display:grid; grid-template-columns:112px 1fr; gap:10px; padding:11px 0; border-top:1px solid var(--line); font-size:14px; } .facts dt, .facts .k { color:var(--ink-3); }
  ul { margin:6px 0; padding-left:18px; } li { margin:5px 0; }
  .path { display:grid; grid-template-columns:22px 1fr auto; gap:4px 10px; padding:13px 0; border-top:1px solid var(--line); align-items:start; } .path.off { color:var(--ink-3); } .path .n { font:500 15px var(--sans); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; } .path .cap { grid-column:2 / span 2; }
  .path .dl { grid-column:2 / span 2; position:relative; height:6px; margin:6px 0 2px; background:rgba(28,30,26,.08); border-radius:3px; } .path .dl i { position:absolute; left:0; top:0; bottom:0; border-radius:3px; opacity:.85; } .path .dl b { position:absolute; top:-4px; bottom:-4px; width:0; border-left:1.5px dashed var(--ink-2); }
  .tagbest { display:inline-block; margin-left:6px; padding:1px 8px; border-radius:99px; background:var(--green); color:var(--bg); font-size:11.5px; font-weight:600; vertical-align:1px; }
  .path.best { background:linear-gradient(90deg, rgba(111,208,143,.07), transparent 70%); }
  .dlkey i { display:inline-block; width:0; height:12px; border-left:1.5px dashed var(--ink-2); margin-right:8px; vertical-align:-2px; }
  details.off { margin-top:10px; padding-top:10px; border-top:1px solid var(--line); } details.off p { margin:8px 0 0; }

  .btnrow { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; align-items:center; } label.f { display:block; font-size:12.5px; color:var(--ink-3); margin:12px 0 4px; } .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  details summary { cursor:pointer; color:var(--ink-2); font-size:14px; }

<main>
  <div id="mapBox">
    <div id="map" role="application" aria-label="Satellite map of the pipeline"></div>
    <div id="divider"></div>
    <div id="drag" aria-hidden="true"><span id="grip">↔</span></div>

    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M2 16 C6 16 7 6 11 6 S16 15 20 13" fill="none" stroke="#1c1e1a" stroke-width="1.6"/><circle cx="2" cy="16" r="2" fill="#1c1e1a"/><circle cx="11" cy="6" r="2.2" fill="#d68910"/><circle cx="20" cy="13" r="2" fill="#1c1e1a"/></svg>
    <span>Terra<em>Corridor</em></span>
  </a>
    <nav class="pages" aria-label="Pages"><a class="on" href="platform.html" aria-current="page">Class changes</a><a href="index.html?corridor=ab-strathcona-demo">Ground</a><a href="index.html?corridor=ab-strathcona-demo&amp;view=climate">Climate</a><a href="index.html?corridor=ab-strathcona-demo&amp;view=triage">Where to look first</a><a href="index.html?corridor=ab-strathcona-demo&amp;view=log">Work orders</a></nav>

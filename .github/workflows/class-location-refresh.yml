# Weekly class location refresh, without n8n. Replaces the W6 schedule.
# Pulls the free City of Edmonton open data, rebuilds the platform data, the replay and the pages,
# and commits the result. Netlify redeploys from the commit.
# Runs only from the default branch. On a fork, open the Actions tab once and enable workflows.
# A public repo with no activity for 60 days has its schedules switched off by GitHub: re-enable it there.
name: Class location refresh

on:
  schedule:
    - cron: '0 13 * * 1'   # Mondays 13:00 UTC, early morning in Edmonton
  workflow_dispatch:        # the "Run workflow" button, for the first run and for testing

permissions:
  contents: write

concurrency:
  group: class-location-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # If the download fails the script exits non-zero and saves nothing, so the job stops here
      # and the last good data stays on the site. Stale is labelled; wrong is not acceptable.
      - name: Fetch permits, rooflines and plans
        run: node scripts/fetch-permits.js data/snapshot/live-snapshot.json
      - name: Rebuild platform data and pages
        run: npm run build
      - name: Run the tests
        run: npm test
      - name: Commit if the data changed
        run: |
          git config user.name "terracorridor-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add data/cache/permits data/platform dist deploy workflows
          if git diff --cached --quiet; then
            echo "No change in the open data this week."
          else
            git commit -m "Refresh class location data from City of Edmonton open data"
            git push
          fi

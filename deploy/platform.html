<style>
  /* Design rules: .claude/skills/frontend-design/SKILL.md, "Segment record page".
     The imagery is the page. Chrome sits at the edges, one panel tells one kilometre's story, one strip is the line. */
  :root { --bg:#0a0b0a; --glass:rgba(10,11,10,.82); --s2:#161916; --s3:#1d211d; --line:rgba(236,238,230,.12); --ink:#eceee6; --ink-2:#b9bdb2; --ink-3:#9da296;
    --green:#6fd08f; --amber:#f2a93b; --red:#ff5d4f; --grey:#5d625a; --sub:#82c8ff;
    --sans:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; --serif:'Instrument Serif', Georgia, serif; --mono:'JetBrains Mono', ui-monospace, Consolas, monospace; color-scheme:dark; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.55 var(--sans); -webkit-font-smoothing:antialiased; overflow:hidden; }
  button, input, select { font:inherit; color:inherit; }
  a { color:inherit; }
  :focus-visible { outline:2px solid var(--sub); outline-offset:2px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
  main { position:fixed; inset:0; }
  #mapBox, #map { position:absolute; inset:0; } #map { background:#10140f; }
  .leaflet-container { font:12px var(--sans); background:#10140f; }
  /* Imagery is context: toned down so the line, the status colours and the forecast carry the map. */
  .leaflet-tile-pane, .leaflet-after-pane { filter:saturate(.55) brightness(.8) contrast(1.05); }
  .leaflet-tooltip.tc { background:var(--glass); color:var(--ink); border:1px solid var(--line); border-radius:8px; box-shadow:none; font:13px var(--sans); padding:7px 10px; } .leaflet-tooltip.tc::before { display:none; }
  .leaflet-control-attribution { background:transparent !important; color:var(--ink-3) !important; font-size:10.5px; } .leaflet-control-attribution a { color:var(--ink-2) !important; }
  .leaflet-bottom.leaflet-right { right:452px; }
  .glass { background:var(--glass); backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px) saturate(1.2); border:1px solid var(--line); }
  /* top edge */

  header.top > * { pointer-events:auto; }
  .mark { font:500 18px var(--sans); text-decoration:none; } .mark em { font:italic 22px var(--serif); color:var(--amber); }
  nav { display:flex; gap:18px; } nav a { text-decoration:none; color:var(--ink-2); font-size:14px; padding:4px 0; border-bottom:1px solid transparent; } nav a.on { color:var(--ink); border-color:var(--ink); } nav a:hover { color:var(--ink); }
  /* the compare line */
  #divider { position:absolute; top:0; bottom:0; width:1.5px; background:var(--ink); z-index:450; pointer-events:none; }

  #grip { position:absolute; top:46%; left:50%; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%; background:var(--ink); color:var(--bg); display:grid; place-items:center; font:15px var(--mono); box-shadow:0 4px 18px rgba(0,0,0,.45); }
  .side { position:absolute; top:74px; z-index:455; font:11px var(--mono); letter-spacing:.06em; padding:5px 10px; border-radius:99px; white-space:nowrap; pointer-events:none; }
  .yr { position:absolute; top:70px; z-index:470; display:flex; gap:2px; padding:3px; border-radius:99px; } .yr button { background:none; border:0; border-radius:99px; padding:4px 11px; font:500 12px var(--sans); font-variant-numeric:tabular-nums; color:var(--ink-2); cursor:pointer; white-space:nowrap; } .yr button[aria-pressed=true] { background:var(--ink); color:var(--bg); } #ahead button.fut[aria-pressed=true] { background:var(--amber); } .yr .yl { align-self:center; padding:0 6px 0 9px; font:12px var(--sans); color:var(--ink-3); white-space:nowrap; } #aheadNote { position:absolute; top:106px; z-index:470; max-width:300px; padding:6px 10px; border-radius:10px; font-size:12px; color:var(--ink-2); pointer-events:none; }
  .plus { font:600 12px/22px var(--sans); font-variant-numeric:tabular-nums; color:var(--bg); background:var(--amber); border-radius:99px; padding:0 10px; white-space:nowrap; width:auto !important; transform-origin:left; box-shadow:0 2px 8px rgba(0,0,0,.4); } .plus.maybe { background:#d9c48c; }
  /* the line, as a strip */

  #strip .head { display:flex; align-items:center; gap:12px; margin-bottom:10px; font-size:13px; color:var(--ink-2); flex-wrap:wrap; } #strip .head b { color:var(--ink); font-weight:500; }
  #strip .head .need { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  #strip .head .tools { margin-left:auto; display:flex; gap:6px; }
  #strip .head button { background:none; border:1px solid var(--line); border-radius:99px; padding:4px 12px; font-size:13px; cursor:pointer; } #strip .head button:hover { background:var(--s3); }
  #strip .head .kmchip { border-color:var(--ink-2); padding:2px 10px; } #strip .head .kmchip.on { background:var(--ink); color:var(--bg); }
  #strip .head .hi { background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:600; } #strip .head .hi:hover { background:#fff; }
  #strip .cells { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:3px; }
  #strip .cell { height:30px; border-radius:5px; border:0; padding:0; cursor:pointer; font:600 12px var(--sans); font-variant-numeric:tabular-nums; color:var(--bg); position:relative; transition:transform .15s; background:var(--c); }
  #strip .cell.st-watch { background:repeating-linear-gradient(135deg, var(--c), var(--c) 4px, #a8975f 4px, #a8975f 8px); }
  #strip .cell.st-nodata { color:var(--ink-2); }
  #strip .cell:hover { transform:translateY(-2px); } #strip .cell.sel { outline:2px solid var(--ink); outline-offset:2px; }
  #strip .cell.open::after { content:''; position:absolute; top:-9px; left:50%; width:8px; height:8px; margin-left:-4px; border-radius:50%; background:var(--bg); border:2px solid var(--ink); }
  #strip .ruler { margin-top:5px; font:11px var(--sans); font-variant-numeric:tabular-nums; color:var(--ink-3); } #strip .ruler span { text-align:center; }
  #strip .key { display:flex; gap:16px; margin-top:7px; font-size:12px; color:var(--ink-2); flex-wrap:wrap; align-items:center; } #strip .key i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  #strip .key i.hatch { background:repeating-linear-gradient(135deg, #d9c48c, #d9c48c 2px, #a8975f 2px, #a8975f 4px); } #strip .key i.ring { border-radius:50%; background:var(--bg); border:2px solid var(--ink); width:9px; height:9px; }
  #strip .key .why { color:var(--ink-3); flex-basis:100%; }
  /* one kilometre's story */
  #inspector { position:absolute; top:70px; right:22px; bottom:20px; width:430px; z-index:600; border-radius:16px; overflow-y:auto; padding:22px 26px 40px; scrollbar-width:thin; }
  .steps { display:flex; gap:18px; margin-bottom:22px; border-bottom:1px solid var(--line); } .steps button { background:none; border:0; padding:0 0 10px; margin-bottom:-1px; color:var(--ink-3); cursor:pointer; font-size:14px; border-bottom:1.5px solid transparent; } .steps button[aria-selected=true] { color:var(--ink); border-color:var(--ink); } .steps .corr { margin-left:auto; }
  .where { font:11px var(--mono); letter-spacing:.08em; color:var(--ink-3); }
  h1 { font:italic 400 64px/1 var(--serif); margin:6px 0 16px; letter-spacing:-.01em; }
  h1.t { font:600 26px/1.2 var(--sans); letter-spacing:-.01em; margin:2px 0 12px; } h1 .sub { display:block; font:400 14px var(--sans); color:var(--ink-3); margin-top:4px; letter-spacing:0; }
  .why { color:var(--ink-2); font-size:14.5px; line-height:1.5; }
  .bignum { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; align-items:center; margin:18px 0; padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .bignum b { font:500 40px/1 var(--sans); font-variant-numeric:tabular-nums; letter-spacing:-.02em; color:var(--amber); white-space:nowrap; } .bignum span { font-size:13px; color:var(--ink-2); line-height:1.45; }
  .photos { display:flex; gap:4px; flex-wrap:wrap; margin:6px 0 8px; } .photos button { background:none; border:1px solid var(--line); border-radius:99px; padding:5px 12px; font-size:13px; cursor:pointer; } .photos button[aria-pressed=true] { background:var(--ink); color:var(--bg); border-color:var(--ink); } .photos .play { margin-left:auto; border-color:var(--ink-2); }
  .proofchart, .spark { display:block; width:100%; height:auto; color:var(--ink); margin:6px 0 4px; } .proofchart text, .spark text { font:11px var(--sans); fill:var(--ink-3); font-variant-numeric:tabular-nums; }
  .facts .wide { display:block; } .facts .wide .k { display:block; margin-bottom:2px; }
  h2 { font:500 15px var(--sans); color:var(--ink); margin:28px 0 8px; }
  p { margin:0 0 12px; } .lead { font-size:19px; line-height:1.42; text-wrap:pretty; } .cap { color:var(--ink-3); font-size:13px; } .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .status { display:inline-flex; align-items:center; gap:8px; font-size:13.5px; margin-bottom:12px; } .status i { width:9px; height:9px; border-radius:50%; background:currentColor; }
  .c-red { color:var(--red); } .c-amber { color:var(--amber); } .c-green { color:var(--green); } .c-grey { color:var(--ink-3); } .c-sand { color:#d9c48c; }
  .chip.c-sand i, .status.c-sand i { background:#d9c48c; }
  .spark { display:block; margin-top:10px; color:var(--ink); } .spark-k { display:block; font-size:11.5px; }
  .years { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:6px; height:84px; margin:18px 0 6px; align-items:end; }
  .years div { display:flex; flex-direction:column; justify-content:flex-end; height:100%; gap:5px; } .years i { display:block; background:rgba(217,196,140,.45); border-radius:2px 2px 0 0; min-height:1px; } .years i.on { background:var(--amber); }
  .years span { font:500 11px/1 var(--mono); color:var(--ink-3); text-align:center; }
  .trio { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; margin:22px 0 14px; } .trio b { display:block; font:500 34px/1.1 var(--sans); font-variant-numeric:tabular-nums; letter-spacing:-.02em; } .trio span { font-size:12.5px; color:var(--ink-3); line-height:1.35; display:block; margin-top:4px; }
  .bar { position:relative; height:8px; background:rgba(236,238,230,.1); border-radius:4px; margin:6px 0 30px; } .bar span { position:absolute; top:0; bottom:0; } .bar .ex { background:var(--ink); border-radius:4px 0 0 4px; } .bar .co { background:var(--amber); } .bar .po { background:repeating-linear-gradient(45deg, var(--amber), var(--amber) 2px, transparent 2px, transparent 5px); }
  .bar .mk { width:1px; top:-5px; bottom:-5px; background:var(--ink-2); } .bar .mk::after { content:attr(data-l); position:absolute; top:19px; left:-2px; width:110px; font:11px var(--sans); color:var(--ink-3); }
  .note { border-left:2px solid var(--line); padding:1px 0 1px 14px; margin:14px 0; color:var(--ink-2); font-size:14px; } .note.warn { border-color:var(--amber); } .note.bad { border-color:var(--red); color:var(--ink); }
  .facts { margin:8px 0 0; } .facts div { display:grid; grid-template-columns:112px 1fr; gap:10px; padding:11px 0; border-top:1px solid var(--line); font-size:14px; } .facts dt, .facts .k { color:var(--ink-3); }
  ul { margin:6px 0; padding-left:18px; } li { margin:5px 0; }
  .path { display:grid; grid-template-columns:22px 1fr auto; gap:4px 10px; padding:13px 0; border-top:1px solid var(--line); align-items:start; } .path.off { color:var(--ink-3); } .path .n { font:500 15px var(--sans); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; } .path .cap { grid-column:2 / span 2; }
  .path .dl { grid-column:2 / span 2; position:relative; height:6px; margin:6px 0 2px; background:rgba(236,238,230,.08); border-radius:3px; } .path .dl i { position:absolute; left:0; top:0; bottom:0; border-radius:3px; opacity:.85; } .path .dl b { position:absolute; top:-4px; bottom:-4px; width:0; border-left:1.5px dashed var(--ink-2); }
  .tagbest { display:inline-block; margin-left:6px; padding:1px 8px; border-radius:99px; background:var(--green); color:var(--bg); font-size:11.5px; font-weight:600; vertical-align:1px; }
  .path.best { background:linear-gradient(90deg, rgba(111,208,143,.07), transparent 70%); }
  .dlkey i { display:inline-block; width:0; height:12px; border-left:1.5px dashed var(--ink-2); margin-right:8px; vertical-align:-2px; }
  details.off { margin-top:10px; padding-top:10px; border-top:1px solid var(--line); } details.off p { margin:8px 0 0; }
  .btn { background:var(--ink); color:var(--bg); border:0; border-radius:99px; padding:9px 18px; font-weight:600; cursor:pointer; } .btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); font-weight:500; } .btn.ghost:hover { background:var(--s3); }
  .btnrow { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; align-items:center; } label.f { display:block; font-size:12.5px; color:var(--ink-3); margin:12px 0 4px; } .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  select, input[type=text], input[type=number], input:not([type]) { background:rgba(236,238,230,.06); border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:100%; }
  header select { width:auto; border-radius:99px; padding:5px 10px; font-size:13px; }
  header .rules { color:var(--ink-2); display:flex; align-items:center; gap:8px; padding:4px 4px 4px 14px; border-radius:99px; }
  details summary { cursor:pointer; color:var(--ink-2); font-size:14px; }
  table { width:100%; border-collapse:collapse; font-size:14px; } td { padding:9px 6px 9px 0; border-top:1px solid var(--line); vertical-align:top; }
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:99px; font-size:14px; display:none; z-index:999; }
  @media (max-width:900px) { body { overflow:auto; } main { position:static; } #mapBox { position:relative; height:70vh; } #strip, #inspector { position:static; width:auto; margin:12px; } .leaflet-bottom.leaflet-right { right:0; } }
  @media (prefers-reduced-motion: reduce) { #strip .cell { transition:none; } }
</style>

<body>
<main>
  <div id="mapBox">
    <div id="map" role="application" aria-label="Satellite map of the pipeline"></div>
    <div id="divider"></div>
    <div id="drag" aria-hidden="true"><span id="grip">↔</span></div>
    <div class="glass yr" id="ahead" role="group" aria-label="Right of the line: today, or a forecast year"></div>
    <div class="glass yr" id="years" role="group" aria-label="Older imagery to compare with today"></div>
    <div class="glass" id="aheadNote" aria-live="polite"></div>
    <input class="sr" id="swipe" type="range" min="2" max="98" value="26" aria-label="Move the compare line. Older imagery is on the left, today on the right.">
  </div>
  <header class="top">
    <a class="mark" href="platform.html">Terra<em>Corridor</em></a>
    <nav aria-label="Pages"><a class="on" href="platform.html" aria-current="page">Segment record</a><a href="index.html?corridor=ab-strathcona-demo">Ground and climate</a><a href="index.html?corridor=ab-strathcona-demo#/log">Work orders</a></nav>
    <span style="flex:1"></span>
    <label class="cap glass rules">Rules <select id="jur" aria-label="Regulator"><option value="CA">Canada, CER</option><option value="US">United States, PHMSA</option></select></label>
  </header>
  <div class="glass" id="strip" aria-label="The pipeline, kilometre by kilometre"></div>
  <aside class="glass" id="inspector" aria-live="polite"></aside>
</main>
<div id="toast" role="status"></div>

    <p class="lead">In 2019 this stretch had ${c.units.roofsAtBaseline ? c.units.roofsAtBaseline + ' homes' : 'no homes'} within 200 m of the line. It is Class ${c.class.now} today${c.units.existing ? `, with about ${c.units.existing} homes` : ''}.</p>
    ${lag != null ? `<div class="bignum"><b>${String(lag).replace('.5', '½')} months</b><span>of warning: the median wait from building permit to move-in, measured across Edmonton. The class changes when people move in; the permits are public months before.</span></div>` : ''}
    <div class="photos" role="group" aria-label="Show the photo from">${PHOTOS.map((p) => `<button type="button" data-photo="${p.k}" aria-pressed="${p.k === proofAt}">${p.label}</button>`).join('')}${reduced ? '' : '<button type="button" id="playProof" class="play">Play</button>'}</div>
    ${proofChart(ps, proofAt)}
    <div class="facts">
      ${ps.cross[2] ? `<div><span class="k">Class 2 line</span><span>Crossed by building permits in <b>${monthYear(ps.cross[2])}</b>.</span></div>` : ''}
      ${ps.cross[3] ? `<div><span class="k">Class 3 line</span><span>Crossed by building permits in <b>${monthYear(ps.cross[3])}</b>.</span></div>` : ''}
      <div><span class="k">Photos</span><span>Esri releases of ${PHOTOS.slice(0, 3).map((p) => p.k).join(', ')} and today. The release date can be later than the photo.</span></div>
    </div>
    <p class="note warn">Permit dates are real City of Edmonton records, grouped by quarter. Move-in dates on this stretch are estimated from the city-wide median, not observed one by one.</p>
    <div class="btnrow"><button type="button" class="btn ghost" data-go="${esc(r.id)}">Back to km ${r.kmFrom}–${r.kmTo}</button></div>`;
}
function renderInspector() {
  const r = rec(), view = { changed: changedStep, options: optionsStep, decide: decideStep, record: recordStep, proof: proofStep }[step];
  $('inspector').innerHTML = `<div class="steps" role="tablist">${STEPS.map(([k, l]) => `<button role="tab" aria-selected="${step === k}" data-step="${k}">${l}</button>`).join('')}<button role="tab" class="corr" aria-selected="${step === 'corridor'}" data-step="corridor">Corridor</button></div>` + (view ? view(r) : corridorStep());
  const q = (s) => $('inspector').querySelectorAll(s), on = (id, fn) => { if ($(id)) $(id).onclick = fn; };
  for (const b of q('[data-step]')) b.onclick = () => { step = b.dataset.step; if (proofMode) { leaveProof(); paintMap(); } renderInspector(); $('inspector').scrollTop = 0; };
  for (const b of q('[data-photo]')) b.onclick = () => { if (playTimer) { clearTimeout(playTimer); playTimer = null; } showPhoto(b.dataset.photo); };
  on('playProof', playProof); on('proofBtn2', openProof); on('proofBtn3', openProof);
  for (const b of q('[data-go]')) b.onclick = () => select(b.dataset.go);
  for (const el of q('input[name=path]')) el.onchange = () => { chosen[r.id] = el.value; };
  for (const b of q('button[data-act]')) b.onclick = () => decide(r, r.drafts[+b.dataset.i], b.dataset.act);
  for (const el of q('input[data-k]')) el.onchange = () => { const v = +el.value; if (v >= 0) { store.assumptions[el.dataset.k] = v; save(); render(); } };
  on('addFinding', () => addFinding(r));
  if ($('thr')) $('thr').onchange = () => { const v = +$('thr').value; if (v >= 5 && v <= 95) { store.orderAt = v; save(); renderInspector(); } };
  on('xPack', () => download(`evidence-${r.id}.pdf`, EXPORT.pdf('TerraCorridor evidence pack', EXPORT.evidenceLines(LEDGER.evidencePack(r, store.ledger, DATA.sources))), 'application/pdf'));
  on('xFiling', () => download(`draft-plan-${r.id}.pdf`, EXPORT.pdf('Draft class location plan', EXPORT.draftFilingLines(r, r.decision, chosen[r.id] || (r.decision.lowestCost && r.decision.lowestCost.key))), 'application/pdf'));
  on('resetAssume', () => { store.assumptions = {}; save(); render(); });
  on('xCsv', () => (store.orders.length ? download('terracorridor-work-orders.csv', EXPORT.workOrdersCsv(store.orders), 'text/csv') : toast('No approved work orders yet.')));
  on('xGeo', () => download('terracorridor-segments.geojson', JSON.stringify(EXPORT.segmentsGeoJSON(built.records, DATA.segments)), 'application/geo+json'));
  on('xLabels', () => (built.labels.length ? download('prediction-vs-field.csv', EXPORT.csv(built.labels, ['finding', 'segment', 'module', 'kind', 'predicted', 'observed', 'agreed', 'error', 'at', 'by']), 'text/csv') : toast('No field findings yet.')));
}
function render() { compute(); renderStrip(); paintMap(); renderInspector(); }

/* ---------- actions ---------- */
async function send(path, body) {
  if (!API) return 'kept in this browser';
  try { const res = await fetch(API.replace(/\/$/, '') + path, { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, N8N_KEY ? { 'X-TerraCorridor-Key': N8N_KEY } : {}), body: JSON.stringify(body) }); return res.ok ? 'recorded in n8n' : res.status === 403 ? 'n8n refused it: missing or wrong key (open the page once with ?key=...), kept in this browser' : 'n8n refused it (' + res.status + '), kept in this browser'; }
  catch (e) { return 'n8n not reachable, kept in this browser'; }
}
async function decide(r, draft, decision) {
  const by = $('who').value, reason = $('why').value, path = draft.module === 'class_location' && r.decision ? (chosen[r.id] || (r.decision.lowestCost && r.decision.lowestCost.key)) : null;
  const est = path && r.decision ? (r.decision.paths.find((p) => p.key === path) || {}).total : null;
  try { store.ledger = LEDGER.decide(store.ledger, draft, { decision, by, reason, chosen: path, estimate: est }); }
  catch (e) { return toast(e.message.charAt(0).toUpperCase() + e.message.slice(1) + '.'); }
  if (decision === 'approve') store.orders.push(PLATFORM.workOrderFor(r, draft, { by, chosen: path }));
  save(); render();
  toast((decision === 'approve' ? 'Approved' : 'Rejected') + ': ' + await send('/decide', { action: { id: draft.id, module: draft.module, segment: draft.segment, kind: draft.kind, inputsHash: draft.inputsHash }, decision, by, reason, chosen: path, estimate: est }) + '.');
}
async function addFinding(r) {
  const raw = { kind: $('fk').value, segment: r.id, value: $('fv').value, note: $('fn').value, withinPrescribedArea: $('fp').checked, by: $('who') ? $('who').value : '' };
  const { finding, problems } = FEEDBACK.normalize(raw);
  if (problems.length) return toast('Not recorded: ' + problems.join(', ').replace('no name', 'enter your name under Decide') + '.');
  store.findings.push(finding);
  store.ledger = LEDGER.recordOutcome(store.ledger, { segment: r.id, module: finding.module, finding: finding.kind, value: finding.value, note: finding.note, by: finding.by, at: finding.at });
  save(); render(); toast('Finding recorded: ' + await send('/finding', raw) + '.');
}
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

$('jur').value = store.jurisdiction;
$('jur').onchange = () => { store.jurisdiction = $('jur').value; save(); render(); };
compute(); initMap(); render();

</script>
</body>
</html>

<style>/* required styles */

.leaflet-bar {

.leaflet-popup {

.leaflet-popup-content-wrapper {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;

	color: #222;

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {

	}

	}

	margin-left: -6px;
}
.leaflet-tooltip-right {
	margin-left: 6px;
}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	top: 50%;

	}
.leaflet-tooltip-left:before {

<style>
  /* Tokens and rules: .claude/skills/frontend-design/SKILL.md. Tier colours are for pipeline risk only and are not used here. */

  .kpi p { margin:2px 0 0; font-size:13px; color:var(--ink-2); }
  .filters { display:grid; gap:8px; margin-bottom:12px; padding:10px; border:1px solid var(--line); border-radius:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips label { display:inline-flex; align-items:center; gap:5px; font-size:12px; border:1px solid var(--line-2); border-radius:999px; padding:3px 9px; cursor:pointer; }
  ul.list { list-style:none; margin:0; padding:0; }
  ul.list li button { width:100%; text-align:left; background:none; border:0; border-top:1px solid var(--line); padding:9px 4px; cursor:pointer; display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; }
  ul.list li button:hover, ul.list li button[aria-current=true] { background:var(--s2); }
  .dot { width:10px; height:10px; border-radius:50%; }
  .status { font:500 11px/1 var(--mono); padding:3px 6px; border-radius:999px; border:1px solid var(--line-2); color:var(--ink-2); white-space:nowrap; }
  .bar { height:6px; background:var(--s3); border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  th, td { text-align:left; padding:6px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--ink-3); font-weight:500; cursor:pointer; position:sticky; top:0; background:var(--s1); }
  td.n { font-family:var(--mono); text-align:right; }
  .btn { background:var(--ink); color:var(--s1); border:0; border-radius:6px; padding:7px 12px; font-weight:600; cursor:pointer; }
  .btn.o { background:none; color:var(--ink); border:1px solid var(--line-2); }
  .factor { display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:8px 0; border-top:1px solid var(--line); }
  .factor .why { grid-column:1/-1; font-size:13px; color:var(--ink-2); }
  .unknown { color:var(--ink); background:repeating-linear-gradient(45deg,#2a2e2a 0 4px,#1a1d1a 4px 8px); padding:1px 6px; border-radius:4px; }
  .note { font-size:13.5px; color:var(--ink-2); border-left:2px solid var(--line-2); padding-left:10px; margin:12px 0; }
  .assume { display:grid; grid-template-columns:1fr 110px; gap:4px 10px; align-items:center; padding:7px 0; border-top:1px solid var(--line); }
  .assume small { grid-column:1/-1; color:var(--ink-3); font-size:11.5px; }
  .assume input { width:110px; text-align:right; font-family:var(--mono); }
  h2 { font:600 15px/1.3 var(--sans); margin:18px 0 8px; }
  h3 { font:600 13px/1.3 var(--sans); margin:14px 0 6px; }
  .src { border-top:1px solid var(--line); padding:8px 0; font-size:12px; }
  .src code { font-family:var(--mono); font-size:11px; color:var(--ink-3); word-break:break-all; }
  @media (max-width: 900px) {
    body { height:auto; overflow:auto; display:block; }
    header.top { position:sticky; top:0; z-index:1000; padding:8px 12px; }
    main { display:block; }
    #mapWrap { height:58vh; }
    aside { border-left:0; border-top:1px solid var(--line); }
    .panel { overflow:visible; padding:16px 14px 60px; }
    #legend { max-width:200px; font-size:11px; padding:8px; }
    #resNote { display:none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>

<header class="top">

    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M2 16 C6 16 7 6 11 6 S16 15 20 13" fill="none" stroke="#eceee6" stroke-width="1.6"/><circle cx="2" cy="16" r="2" fill="#eceee6"/><circle cx="11" cy="6" r="2.2" fill="#d6f35f"/><circle cx="20" cy="13" r="2" fill="#eceee6"/></svg>
    <span>Terra<em>Corridor</em></span>
  </a>
  <nav class="pages" aria-label="Pages"><a href="./">Pipeline risk</a><a href="./renewables.html" class="on" aria-current="page">Renewables</a></nav>
  <label class="ctl">Pipeline <select id="pipelineSel" aria-label="Filter by pipeline"></select></label>
  <span class="ctl">Layer <span class="seg" id="layerSeg" role="group" aria-label="Map layer">
    <button data-layer="solar" aria-pressed="true">Solar</button><button data-layer="wind" aria-pressed="false">Wind</button><button data-layer="both" aria-pressed="false">Both</button></span></span>
  <span class="spacer"></span>

      <button role="tab" data-tab="detail" aria-selected="false">Detail</button>
      <button role="tab" data-tab="table" aria-selected="false">Table</button>
      <button role="tab" data-tab="money" aria-selected="false">Money</button>
      <button role="tab" data-tab="sources" aria-selected="false">Sources</button>

  </aside>

<script>// TerraCorridor renewable-energy screening assessor. Pure JS, runs in the browser and in Node.
// Separate from pipeline risk (src/engine.js): it reads no risk score, tier, threshold or work order.
//
// Rules that keep it honest:
//  - Every factor is a linear ramp between two stated values, so a score can be checked by hand.
//  - A required input that is missing makes the candidate "incomplete": no ranked score, and the
//    missing factor is never scored as 0 cost or as best case.
//  - Land rights, interconnection capacity and permitting are never assessed here, so nothing is
//    ever labelled "feasible". The best status is a strong screening result with open gates.
//  - Capacity and money are scenarios from editable assumptions, not predictions.
(function (root) {
  const ramp = (v, lo, hi) => Math.max(0, Math.min(100, ((v - lo) / (hi - lo)) * 100));
  const num = (v) => typeof v === 'number' && Number.isFinite(v);
  const round = (v, n = 1) => (num(v) ? Math.round(v * 10 ** n) / 10 ** n : null);

  const FACTORS = {
    solar: [
      { key: 'resource', label: 'Solar resource', weight: 0.35, unit: 'kWh/kWp/yr', lo: 900, hi: 1600, read: (c) => c.resource && c.resource.pvout, source: 'gsa',
        why: 'Expected output per kW of panels (Global Solar Atlas). 900 scores 0, 1,600 scores 100.' },
      { key: 'terrain', label: 'Terrain (median slope)', weight: 0.15, unit: '%', lo: 15, hi: 3, read: (c) => c.land && c.land.slopeMedianPct, source: 'dem',
        why: 'Median slope from Copernicus GLO-30. 3% or flatter scores 100, 15% or steeper scores 0.' },
      { key: 'area', label: 'Usable area', weight: 0.25, unit: 'ha', lo: 0, hi: 10, read: (c) => c.land && c.land.usableHa, source: 'worldcover',
        why: 'Open land, not too steep, not protected. 10 ha or more scores 100.' },
      { key: 'grid', label: 'Distance to mapped substation', weight: 0.25, unit: 'km', lo: 15, hi: 1, read: gridKm, source: 'canvec',
        why: 'Nearest CanVec transformer station. 1 km or closer scores 100, 15 km or farther scores 0.' },
    ],
    wind: [
      { key: 'resource', label: 'Wind at 100 m', weight: 0.40, unit: 'm/s', lo: 5, hi: 9, read: windSpeed, source: 'gwa_ws100',
        why: 'Average wind speed at turbine height, 100 m (Global Wind Atlas). 5 m/s scores 0, 9 m/s scores 100.' },
      { key: 'terrain', label: 'Terrain (median slope)', weight: 0.15, unit: '%', lo: 25, hi: 5, read: (c) => c.land && c.land.slopeMedianPct, source: 'dem',
        why: 'Median slope from Copernicus GLO-30. 5% or flatter scores 100, 25% or steeper scores 0.' },
      { key: 'area', label: 'Usable area', weight: 0.20, unit: 'ha', lo: 0, hi: 100, read: (c) => c.land && c.land.usableHa, source: 'worldcover',
        why: 'Usable land, not too steep, not protected. 100 ha or more scores 100.' },
      { key: 'grid', label: 'Distance to mapped substation', weight: 0.25, unit: 'km', lo: 25, hi: 2, read: gridKm, source: 'canvec',
        why: 'Nearest CanVec transformer station. 2 km or closer scores 100, 25 km or farther scores 0.' },
    ],
  };
  // A station beyond the search radius is a known bad value, not an unknown one.
  function gridKm(c) {
    const g = c.grid || {};
    if (num(g.stationKm)) return g.stationKm;
    if (g.reason && /no mapped transformer station within/.test(g.reason) && num(g.searchKm)) return { beyond: g.searchKm };
    return null;
  }
  function windSpeed(c) {
    const r = c.resource || {};
    if (c.land && num(c.land.usableHa) && c.land.usableHa > 0 && num(r.ws100Usable)) return r.ws100Usable;
    return num(r.ws100) ? r.ws100 : null;
  }

  const DEFAULTS = {
    minUsableHa: { solar: 2, wind: 20 },
    maxProtectedPct: 50,
    bands: { strong: 70, moderate: 45 },
    // A good site cannot make up for a weak resource: below this resource score the status is capped at moderate.
    strongNeedsResource: 70,
    gates: ['Land rights and landowner consent', 'Interconnection capacity and queue', 'Permits, setbacks and Indigenous consultation'],
  };

  // Every assumption carries where it came from. "placeholder" means not sourced: edit it.
  const ASSUMPTIONS = {
    priceCadPerMwh: {
      'ab-strathcona-demo': { value: 43.68, source: 'AESO 2025 Annual Market Statistics: average pool price 2025', url: 'https://www.aeso.ca/assets/Annual-Market-Stats-2025.pdf' },
      'bc-coquihalla': { value: 74, source: 'BC Hydro 2024 Call for Power: weighted average levelized price of accepted EPAs (2024$). Only awarded projects get it.', url: 'https://www.bchydro.com/news/press_centre/news_releases/2025/statement-bcuc-accepts-bc-hydro-2024-call-for-power-electricity-purchase-agreements.html' },
    },
    fxCadPerUsd: { value: 1.38, source: 'placeholder exchange rate: edit to the current rate' },
    discountRatePct: { value: 7, source: 'placeholder' },
    lifeYears: { value: 25, source: 'placeholder' },
    landCostCadPerHaYr: { value: null, source: 'not known: land rights are not assessed. Leave blank to show results before land cost.' },
    spurCadPerKm: { value: 1000000, source: 'placeholder cost of a new line to the substation' },
    connectionUsdPerKw: { value: 100, source: 'NREL ATB 2024 grid connection cost assumption, $100/kW (2022 USD)', url: 'https://atb.nrel.gov/electricity/2024/definitions' },
    solar: {
      densityMwPerHa: { value: 0.4, source: 'placeholder ground-mount density (MWdc per hectare)' },
      captureRatio: { value: 1.0, source: 'placeholder: share of the average price solar output earns. Alberta solar often earns less than the average.' },
      capexCadPerWdc: { value: 1.5, source: 'placeholder installed cost' },
      opexCadPerKwYr: { value: 25, source: 'placeholder' },
    },
    wind: {
      densityMwPerKm2: { value: 3, source: 'placeholder array density' },
      turbineMw: { value: 4.5, source: 'placeholder turbine rating' },
      lossPct: { value: 15, source: 'placeholder losses applied to the Global Wind Atlas gross capacity factor' },
      capexUsdPerKw: { value: 1968, source: 'NREL ATB 2025: 2023 market-average land-based turbine CAPEX $1,968/kW (Stehly et al., 2024)', url: 'https://atb.nlr.gov/electricity/2025/Land-Based_Wind' },
      opexUsdPerKwYr: { value: 43, source: 'NREL ATB 2025: 2023 market-average OPEX $43/kW/yr', url: 'https://atb.nlr.gov/electricity/2025/Land-Based_Wind' },
    },
  };
  // Flatten to plain numbers for a corridor: { priceCadPerMwh, fxCadPerUsd, ..., solar:{...}, wind:{...} }
  function assumptionValues(corridorId, overrides) {
    const v = (o) => o.value;
    const out = { priceCadPerMwh: (ASSUMPTIONS.priceCadPerMwh[corridorId] || { value: null }).value };
    for (const k of ['fxCadPerUsd', 'discountRatePct', 'lifeYears', 'landCostCadPerHaYr', 'spurCadPerKm', 'connectionUsdPerKw']) out[k] = v(ASSUMPTIONS[k]);
    for (const t of ['solar', 'wind']) out[t] = Object.fromEntries(Object.entries(ASSUMPTIONS[t]).map(([k, o]) => [k, o.value]));
    if (overrides) {
      for (const [k, val] of Object.entries(overrides)) {
        if (k === 'solar' || k === 'wind') Object.assign(out[k], val); else out[k] = val;
      }
    }
    return out;
  }

  function assess(c, cfg = DEFAULTS) {
    const defs = FACTORS[c.tech];
    if (!defs) throw new Error('unknown technology ' + c.tech);
    const factors = defs.map((d) => {
      const raw = d.read(c);
      if (raw && typeof raw === 'object' && num(raw.beyond)) {
        return { key: d.key, label: d.label, weight: d.weight, known: true, value: raw.beyond, unit: d.unit, display: `more than ${raw.beyond} ${d.unit}`, score: 0, why: d.why, source: d.source };

function tableRows() {

}

function syncUrl() { const u = new URL(location.href); u.searchParams.set('pipeline', state.pipeline); u.searchParams.set('layer', state.layer); history.replaceState(null, '', u.pathname + u.search + u.hash); }

document.querySelectorAll('#layerSeg button').forEach((b) => b.onclick = () => { state.layer = b.dataset.layer; document.querySelectorAll('#layerSeg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); syncUrl(); refresh(); });
document.querySelectorAll('#layerSeg button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.layer === state.layer)));
document.querySelectorAll('#tabs button').forEach((b) => b.onclick = () => setTab(b.dataset.tab));
function refresh() { drawMap(false); setTab(state.tab); }
compute();
if (state.selected && !allRows().some((r) => r.id === state.selected)) state.selected = null;
if (state.selected) { const r = allRows().find((x) => x.id === state.selected); if (r && !techOk(r)) { state.layer = r.tech; document.querySelectorAll('#layerSeg button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.layer === state.layer))); } }
drawMap(true);
setTab(state.selected ? 'detail' : 'summary');
window.TC_RENEWABLES_STATE = state;
})();
</script>

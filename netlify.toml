# Netlify serves the prebuilt dashboard. deploy/ is committed (npm run build regenerates it),
# so no build step is needed on Netlify.
[build]
  publish = "deploy"
  command = ""

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# The segment record is the home page; the ground and climate dashboard stays at /index.html.
[[redirects]]
  from = "/"
  to = "/platform.html"
  status = 200
  force = true
